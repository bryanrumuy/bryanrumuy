<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Fokus teknis: keamanan aplikasi web, pengujian otomatis, operasional dan deployment">
<title>Fokus teknis: keamanan aplikasi web, pengujian otomatis, operasional dan deployment</title>
<defs><pattern id="fk-grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern></defs>
<style>text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.mono{font-family:'Courier New',monospace}.fk-bd{animation:fk-bd 3s ease-in-out infinite alternate}@keyframes fk-bd{from{stroke-opacity:.35}to{stroke-opacity:1}}.fk-fl{animation:fk-fl 1.6s linear infinite}@keyframes fk-fl{to{stroke-dashoffset:-20}}@keyframes spin{to{transform:rotate(360deg)}}.fk-g{animation:spin 12s linear infinite}.fk-p{animation:fk-p 2.4s ease-in-out infinite alternate}@keyframes fk-p{from{transform:scale(.92)}to{transform:scale(1.1)}}.fk-b{animation:fk-b 2.2s ease-in-out infinite alternate}@keyframes fk-b{from{transform:translateY(3px)}to{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<g transform="translate(10,10)"><rect width="280" height="280" rx="18" fill="#07070b"/><rect width="280" height="280" rx="18" fill="url(#fk-grid)"/><rect class="fk-bd" x="2" y="2" width="276" height="276" rx="16" fill="none" stroke="#ff7a00" stroke-width="2"/><g transform="translate(140,52)"><g class="fk-p"><path d="M0,-19 L16,-12 V1 C16,11 8,17 0,21 C-8,17 -16,11 -16,1 V-12 Z" fill="#38bdf8" fill-opacity=".15" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/><path d="M-6,1 L-1,6 L7,-4" fill="none" stroke="#ffb347" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="140" y="106" font-size="17" font-weight="800" fill="#fff3e0" text-anchor="middle">Keamanan Aplikasi Web</text><rect x="30" y="120" width="220" height="2" rx="1" fill="#ff7a00" fill-opacity=".5"/><circle cx="40" cy="145" r="3.5" fill="#ffb347"/><text x="54" y="150" font-size="14.5" fill="#e8e1d4">Kontrol akses</text><circle cx="40" cy="175" r="3.5" fill="#ffb347"/><text x="54" y="180" font-size="14.5" fill="#e8e1d4">Validasi input</text><circle cx="40" cy="205" r="3.5" fill="#ffb347"/><text x="54" y="210" font-size="14.5" fill="#e8e1d4">Manajemen sesi</text><circle cx="40" cy="235" r="3.5" fill="#ffb347"/><text x="54" y="240" font-size="14.5" fill="#e8e1d4">Audit dependensi</text></g><g transform="translate(310,10)"><rect width="280" height="280" rx="18" fill="#07070b"/><rect width="280" height="280" rx="18" fill="url(#fk-grid)"/><rect class="fk-bd" x="2" y="2" width="276" height="276" rx="16" fill="none" stroke="#ff7a00" stroke-width="2"/><g transform="translate(140,52)"><g transform="scale(1.9)" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-3,-9 H3 M-2,-9 V-2 L-8,8 H8 L2,-2 V-9 M-5,3 H5"/></g><g class="fk-b"><circle cx="-3" cy="12" r="2" fill="#ffb347"/><circle cx="4" cy="8" r="1.6" fill="#ffb347"/></g></g><text x="140" y="106" font-size="17" font-weight="800" fill="#fff3e0" text-anchor="middle">Pengujian Otomatis</text><rect x="30" y="120" width="220" height="2" rx="1" fill="#ff7a00" fill-opacity=".5"/><circle cx="40" cy="145" r="3.5" fill="#ffb347"/><text x="54" y="150" font-size="14.5" fill="#e8e1d4">Tes fitur</text><circle cx="40" cy="175" r="3.5" fill="#ffb347"/><text x="54" y="180" font-size="14.5" fill="#e8e1d4">Tes hak akses per peran</text><circle cx="40" cy="205" r="3.5" fill="#ffb347"/><text x="54" y="210" font-size="14.5" fill="#e8e1d4">Tes keamanan sebelum rilis</text></g><g transform="translate(610,10)"><rect width="280" height="280" rx="18" fill="#07070b"/><rect width="280" height="280" rx="18" fill="url(#fk-grid)"/><rect class="fk-bd" x="2" y="2" width="276" height="276" rx="16" fill="none" stroke="#ff7a00" stroke-width="2"/><g transform="translate(140,52)"><g class="fk-g"><circle r="14" fill="none" stroke="#38bdf8" stroke-width="7" stroke-dasharray="3.4 3.4"/><circle r="11" fill="#38bdf8" fill-opacity=".2" stroke="#38bdf8" stroke-width="3"/></g><circle r="4.5" fill="#ffb347"/></g><text x="140" y="106" font-size="17" font-weight="800" fill="#fff3e0" text-anchor="middle">Operasional &amp; Deployment</text><rect x="30" y="120" width="220" height="2" rx="1" fill="#ff7a00" fill-opacity=".5"/><circle cx="40" cy="145" r="3.5" fill="#ffb347"/><text x="54" y="150" font-size="14.5" fill="#e8e1d4">Konfigurasi produksi</text><circle cx="40" cy="175" r="3.5" fill="#ffb347"/><text x="54" y="180" font-size="14.5" fill="#e8e1d4">Backup terenkripsi</text><circle cx="40" cy="205" r="3.5" fill="#ffb347"/><text x="54" y="210" font-size="14.5" fill="#e8e1d4">Pemantauan server</text></g>
</svg>
