<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="web-porto - portofolio TypeScript publik">
<title>web-porto - portofolio TypeScript publik</title>
<defs><linearGradient id="tp-hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7f1d1d"/><stop offset=".6" stop-color="#e11d2e"/><stop offset="1" stop-color="#f97316"/></linearGradient></defs>
<style>
.tp-t{font-family:'Segoe UI Black','Arial Black','Segoe UI',Arial,sans-serif;font-weight:900}
.tp-n{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.tp-m{font-family:'Consolas','Courier New',monospace}
@keyframes tp-dt{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.tp-dt{transform-box:fill-box;transform-origin:center;animation:tp-dt 2.4s ease-in-out infinite}
@keyframes tp-hero{0%,100%{opacity:.8}50%{opacity:1}}
.tp-hero{animation:tp-hero 3s ease-in-out infinite}
@keyframes tp-ln{0%{transform:scaleX(.3)}40%,100%{transform:scaleX(1)}}
.tp-ln{transform-box:fill-box;transform-origin:0 50%;animation:tp-ln 5s ease-in-out infinite}
@keyframes tp-cur{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
.tp-cur{animation:tp-cur 1.2s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
