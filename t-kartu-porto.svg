<text class="tp-t" x="46" y="96" font-size="36" fill="#f5f5f5">web-porto</text>
<text class="tp-n" x="46" y="124" font-size="16" fill="#a1a1aa">Web portofolio pribadi berbasis TypeScript.</text>
