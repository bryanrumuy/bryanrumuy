.flow{stroke-dasharray:14 22;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-72}}
.hud{animation:hud 3.6s ease-in-out infinite}
@keyframes hud{0%,100%{opacity:.45}50%{opacity:1}}
.sweep{animation:sweep 6s linear infinite}
@keyframes sweep{0%{transform:translateX(-200px)}28%,100%{transform:translateX(1000px)}}
.sub{animation:sub 9s infinite backwards;animation-timing-function:cubic-bezier(.22,1,.36,1)}
@keyframes sub{0%{opacity:0;transform:translateY(10px)}5%{opacity:1;transform:translateY(0)}28%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-8px)}}
.glowt{animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.35}to{opacity:.7}}
@media (prefers-reduced-motion: reduce){
*{animation:none!important;transition:none!important}
.ember{opacity:.55}.sweep{display:none}.sub2,.sub3{display:none}.sub{opacity:1}
}</style>
