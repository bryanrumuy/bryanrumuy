<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.mono{font-family:'Courier New',monospace}
.in{animation:enter 1.1s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0s)}
@keyframes enter{from{transform:translateY(14px)}to{transform:translateY(0)}}
.spin{animation:spin 24s linear infinite}
.spin-r{animation:spin 16s linear infinite reverse}
.s1{animation:spin 3.2s linear infinite}.s2{animation:spin 5.5s linear infinite reverse}.s3{animation:spin 2.4s linear infinite}.s4{animation:spin 7s linear infinite reverse}
