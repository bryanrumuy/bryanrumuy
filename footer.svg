<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" class="fts" role="img" aria-label="Terima kasih sudah berkunjung">
<title>Terima kasih sudah berkunjung</title>
<style>
.fts{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.ftm{font-family:'Cascadia Code','Consolas','Courier New',monospace}
.fttn{font-variant-numeric:tabular-nums}
.ftca{animation:ftca 9s ease-in-out infinite}
.ftcb{animation:ftca 9s ease-in-out -3s infinite}
.ftcc{animation:ftca 9s ease-in-out -6s infinite}
@keyframes ftca{0%,100%{stop-color:#22d3ee}33%{stop-color:#8b5cf6}66%{stop-color:#ec4899}}
.ftau1{animation:ftau1 16s ease-in-out infinite alternate}
.ftau2{animation:ftau2 19s ease-in-out infinite alternate}
.ftau3{animation:ftau3 22s ease-in-out infinite alternate}
@keyframes ftau1{from{transform:translate(0,0)}to{transform:translate(70px,24px)}}
@keyframes ftau2{from{transform:translate(0,0)}to{transform:translate(-80px,-20px)}}
@keyframes ftau3{from{transform:translate(0,0)}to{transform:translate(-40px,30px)}}
.ftscan{animation:ftscan 9s linear infinite}
.ftpt{animation:ftpt 7s ease-in-out infinite alternate}
@keyframes ftpt{from{transform:translateY(0);opacity:.25}to{transform:translateY(-14px);opacity:.85}}
.ftpl{animation:ftpl 4s ease-in-out infinite}
@keyframes ftpl{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
.ftfb{transform-box:fill-box;transform-origin:center}

.ftw1{animation:ftmv 16s linear infinite}
.ftw2{animation:ftmv 24s linear infinite reverse}
.ftw3{animation:ftmv 34s linear infinite}
@keyframes ftmv{from{transform:translateX(0)}to{transform:translateX(-900px)}}
.ftbr{animation:ftbrt 6s ease-in-out infinite}
.ftbr2{animation:ftbrt 6s ease-in-out -2.5s infinite}
@keyframes ftbrt{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-3px);opacity:.78}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="ftbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05060f"/><stop offset="1" stop-color="#0a0d24"/></linearGradient>
<linearGradient id="ftgA" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#22d3ee" class="ftca"/><stop offset=".5" stop-color="#8b5cf6" class="ftcb"/><stop offset="1" stop-color="#ec4899" class="ftcc"/></linearGradient><linearGradient id="ftgT" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" class="ftca"/><stop offset=".5" stop-color="#8b5cf6" class="ftcb"/><stop offset="1" stop-color="#ec4899" class="ftcc"/></linearGradient>
<linearGradient id="ftgB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
<radialGradient id="fta1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".42"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="fta2"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<radialGradient id="fta3"><stop offset="0" stop-color="#ec4899" stop-opacity=".36"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
<linearGradient id="ftsc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".55"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></linearGradient>
<pattern id="ftdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#ffffff" fill-opacity=".09"/></pattern>
<linearGradient id="ftwg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1800" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".1667" stop-color="#8b5cf6"/><stop offset=".3333" stop-color="#ec4899"/><stop offset=".5" stop-color="#22d3ee"/><stop offset=".6667" stop-color="#8b5cf6"/><stop offset=".8333" stop-color="#ec4899"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
</defs>
<rect width="900" height="160" fill="url(#ftbg)"/>
<g class="ftau1"><ellipse cx="180" cy="56" rx="260" ry="150" fill="url(#fta1)"/></g>
