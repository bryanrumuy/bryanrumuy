<circle class="ftpt" cx="833" cy="133" r="1.6" fill="#e8ecff" style="animation-duration:10s;animation-delay:-6s"/>
<circle class="ftpt" cx="162" cy="131" r="1.6" fill="#ec4899" style="animation-duration:6s;animation-delay:-7s"/>
<circle class="ftpt" cx="793" cy="100" r="2" fill="#ec4899" style="animation-duration:8s;animation-delay:-5s"/>
<circle class="ftpt" cx="690" cy="45" r="1.6" fill="#ec4899" style="animation-duration:10s;animation-delay:-7s"/>
<circle class="ftpt" cx="587" cy="108" r="1.3" fill="#e8ecff" style="animation-duration:10s;animation-delay:-7s"/>
<g class="ftw1"><path d="M0 118Q75 109 150 118T300 118T450 118T600 118T750 118T900 118T1050 118T1200 118T1350 118T1500 118T1650 118T1800 118" fill="none" stroke="url(#ftwg)" stroke-width="8" stroke-opacity="0.13"/><path d="M0 118Q75 109 150 118T300 118T450 118T600 118T750 118T900 118T1050 118T1200 118T1350 118T1500 118T1650 118T1800 118" fill="none" stroke="url(#ftwg)" stroke-width="1.5" stroke-opacity="0.9"/></g>
<g class="ftw2"><path d="M0 132Q75 125 150 132T300 132T450 132T600 132T750 132T900 132T1050 132T1200 132T1350 132T1500 132T1650 132T1800 132" fill="none" stroke="url(#ftwg)" stroke-width="8" stroke-opacity="0.08"/><path d="M0 132Q75 125 150 132T300 132T450 132T600 132T750 132T900 132T1050 132T1200 132T1350 132T1500 132T1650 132T1800 132" fill="none" stroke="url(#ftwg)" stroke-width="1.5" stroke-opacity="0.6"/></g>
<g class="ftw3"><path d="M0 146Q56.25 140 112.5 146T225 146T337.5 146T450 146T562.5 146T675 146T787.5 146T900 146T1012.5 146T1125 146T1237.5 146T1350 146T1462.5 146T1575 146T1687.5 146T1800 146" fill="none" stroke="url(#ftwg)" stroke-width="8" stroke-opacity="0.06"/><path d="M0 146Q56.25 140 112.5 146T225 146T337.5 146T450 146T562.5 146T675 146T787.5 146T900 146T1012.5 146T1125 146T1237.5 146T1350 146T1462.5 146T1575 146T1687.5 146T1800 146" fill="none" stroke="url(#ftwg)" stroke-width="1.5" stroke-opacity="0.4"/></g>
<g class="ftbr"><text x="450" y="66" text-anchor="middle" font-size="22" font-weight="600" fill="#e8ecff">Terima kasih sudah berkunjung</text></g>
<g class="ftbr2"><text x="450" y="92" text-anchor="middle" font-size="13" letter-spacing="4" fill="#22d3ee">TERBUKA UNTUK KOLABORASI</text></g>
</svg>
