<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140" role="img" aria-label="Dattebayo - terima kasih sudah mampir">
  <defs>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb347"/><stop offset=".5" stop-color="#ff7a00"/><stop offset="1" stop-color="#ff4d00"/></linearGradient>
    <g id="sh">
      <polygon points="0,-46 11,-11 46,0 11,11 0,46 -11,11 -46,0 -11,-11" fill="#1b1b24" stroke="#c8ccd8" stroke-width="2.5" stroke-linejoin="round"/>
      <circle r="9" fill="#07070b" stroke="#ff7a00" stroke-width="2"/>
    </g>
  </defs>
  <style>
    .t { font: 800 18px 'Courier New', monospace; fill: #ffd9a8; letter-spacing: 5px; text-anchor: middle; animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity: .6 } 50% { opacity: 1 } }
  </style>
  <rect width="900" height="140" fill="#0a0a10" rx="18"/>
  <path fill="url(#fire)" fill-opacity=".35" d="M0 90 Q150 50 300 90 T600 90 T900 90 V140 H0Z">
    <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 90 Q150 50 300 90 T600 90 T900 90 V140 H0Z;M0 90 Q150 130 300 90 T600 90 T900 90 V140 H0Z;M0 90 Q150 50 300 90 T600 90 T900 90 V140 H0Z"/>
  </path>
  <path fill="url(#fire)" fill-opacity=".6" d="M0 108 Q150 78 300 108 T600 108 T900 108 V140 H0Z">
    <animate attributeName="d" dur="4s" repeatCount="indefinite" values="M0 108 Q150 78 300 108 T600 108 T900 108 V140 H0Z;M0 108 Q150 138 300 108 T600 108 T900 108 V140 H0Z;M0 108 Q150 78 300 108 T600 108 T900 108 V140 H0Z"/>
  </path>
  <g transform="translate(200 52) scale(.45)"><g><use href="#sh"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/></g></g>
  <g transform="translate(700 52) scale(.45)"><g><use href="#sh"/><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="3s" repeatCount="indefinite"/></g></g>
  <text x="450" y="58" class="t">DATTEBAYO!  TERIMA KASIH SUDAH MAMPIR</text>
</svg>
