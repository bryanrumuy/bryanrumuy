<style>text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.mono{font-family:'Courier New',monospace}@keyframes spin{to{transform:rotate(360deg)}}.dv-s{animation:spin 5s linear infinite}.dv-a{animation:dv-a 5s ease-in-out infinite alternate}.dv-b{animation:dv-b 5s ease-in-out infinite alternate}@keyframes dv-a{from{transform:translateX(-380px)}to{transform:translateX(380px)}}@keyframes dv-b{from{transform:translateX(380px)}to{transform:translateX(-380px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
