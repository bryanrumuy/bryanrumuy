<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Sistem Keuangan Kantor, proyek produksi privat. Laravel 12, MySQL, Tailwind CSS, Alpine.js">
<title>Sistem Keuangan Kantor, proyek produksi privat. Laravel 12, MySQL, Tailwind CSS, Alpine.js</title>
<defs><pattern id="pk-grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern><radialGradient id="pk-ball"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#d4f1ff"/><stop offset=".65" stop-color="#38bdf8"/><stop offset="1" stop-color="#0b3b73"/></radialGradient></defs>
<style>text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.mono{font-family:'Courier New',monospace}.pk-bd{animation:pk-bd 3s ease-in-out infinite alternate}@keyframes pk-bd{from{stroke-opacity:.35}to{stroke-opacity:1}}.pk-fl{animation:pk-fl 1.6s linear infinite}@keyframes pk-fl{to{stroke-dashoffset:-20}}@keyframes spin{to{transform:rotate(360deg)}}.pk-s1{animation:spin 7s linear infinite}.pk-s2{animation:spin 11s linear infinite reverse}.pk-s3{animation:spin 5s linear infinite}.pk-r1{animation:spin 18s linear infinite reverse}.pk-r2{animation:spin 30s linear infinite}.pk-core{animation:pk-pl 2.4s ease-in-out infinite alternate}@keyframes pk-pl{from{transform:scale(.88)}to{transform:scale(1.18)}}@keyframes spin{to{transform:rotate(360deg)}}.pk-ic{animation:pk-ic 4s ease-in-out infinite}@keyframes pk-ic{0%,55%,100%{transform:scale(1)}78%{transform:scale(1.28)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
