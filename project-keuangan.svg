<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" class="kcs" role="img" aria-label="Proyek Sistem Keuangan Kantor">
<title>Proyek Sistem Keuangan Kantor</title>
<style>
.kcs{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.kcm{font-family:'Cascadia Code','Consolas','Courier New',monospace}
.kctn{font-variant-numeric:tabular-nums}
.kcca{animation:kcca 9s ease-in-out infinite}
.kccb{animation:kcca 9s ease-in-out -3s infinite}
.kccc{animation:kcca 9s ease-in-out -6s infinite}
@keyframes kcca{0%,100%{stop-color:#22d3ee}33%{stop-color:#8b5cf6}66%{stop-color:#ec4899}}
.kcau1{animation:kcau1 16s ease-in-out infinite alternate}
.kcau2{animation:kcau2 19s ease-in-out infinite alternate}
.kcau3{animation:kcau3 22s ease-in-out infinite alternate}
@keyframes kcau1{from{transform:translate(0,0)}to{transform:translate(70px,24px)}}
@keyframes kcau2{from{transform:translate(0,0)}to{transform:translate(-80px,-20px)}}
@keyframes kcau3{from{transform:translate(0,0)}to{transform:translate(-40px,30px)}}
.kcscan{animation:kcscan 9s linear infinite}
.kcpt{animation:kcpt 7s ease-in-out infinite alternate}
@keyframes kcpt{from{transform:translateY(0);opacity:.25}to{transform:translateY(-14px);opacity:.85}}
.kcpl{animation:kcpl 4s ease-in-out infinite}
@keyframes kcpl{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
.kcfb{transform-box:fill-box;transform-origin:center}
@keyframes kcscan{from{transform:translateY(0)}to{transform:translateY(304px)}}
.kcin{animation:kcinl 1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes kcinl{from{transform:translateX(-24px)}to{transform:translateX(0)}}
.kcb{transform-box:fill-box;transform-origin:center bottom;animation:kcbar 3.6s ease-in-out infinite alternate}
@keyframes kcbar{from{transform:scaleY(.62)}to{transform:scaleY(1)}}
.kctr{stroke-dasharray:10 7;animation:kcfl 2.4s linear infinite}
@keyframes kcfl{to{stroke-dashoffset:-34}}
.kcdn{transform-box:fill-box;transform-origin:center;animation:kcrot 22s linear infinite}
@keyframes kcrot{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="kcbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05060f"/><stop offset="1" stop-color="#0a0d24"/></linearGradient>
