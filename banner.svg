<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Bryan - Web Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.55" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#1a0b3a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"><animate attributeName="stop-color" values="#00f0ff;#a855f7;#ff2bd6;#00f0ff" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ff2bd6"><animate attributeName="stop-color" values="#ff2bd6;#00f0ff;#a855f7;#ff2bd6" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.12" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="4s" repeatCount="indefinite"/>
    </pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orb1"><stop offset="0" stop-color="#00f0ff" stop-opacity="0.35"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb2"><stop offset="0" stop-color="#ff2bd6" stop-opacity="0.30"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect width="900" height="280" rx="18"/></clipPath>
  </defs>
  <style>
    .name { font: 800 84px 'Segoe UI', Arial, sans-serif; letter-spacing: 14px; }
    .role { font: 600 22px 'Courier New', monospace; fill: #b8c4ff; letter-spacing: 2px; opacity: 0; }
    .r1 { animation: show 9s infinite 0s; }
    .r2 { animation: show 9s infinite 3s; }
    .r3 { animation: show 9s infinite 6s; }
    @keyframes show { 0% {opacity:0; transform: translateY(8px)} 6%,30% {opacity:1; transform: translateY(0)} 36%,100% {opacity:0; transform: translateY(-8px)} }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .tag { font: 700 12px 'Courier New', monospace; fill: #00f0ff; letter-spacing: 4px; }
  </style>
  <g clip-path="url(#card)">
    <rect width="900" height="280" fill="url(#bg)"/>
    <rect width="900" height="280" fill="url(#grid)"/>
    <circle cx="140" cy="60" r="170" fill="url(#orb1)"><animate attributeName="cx" values="140;260;140" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="60;110;60" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="230" r="190" fill="url(#orb2)"><animate attributeName="cx" values="760;640;760" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="230;170;230" dur="11s" repeatCount="indefinite"/></circle>
    <rect x="0" y="-4" width="900" height="3" fill="#00f0ff" opacity="0.5">
      <animate attributeName="y" from="-4" to="284" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="52" text-anchor="middle" class="tag">&lt; HELLO, WORLD /&gt;</text>
    <text x="450" y="150" text-anchor="middle" class="name" fill="url(#neon)" filter="url(#glow)">BRYAN</text>
    <g text-anchor="middle">
      <text x="450" y="205" class="role r1">Web Developer</text>
      <text x="450" y="205" class="role r2">Laravel &amp; TypeScript Builder</text>
      <text x="450" y="205" class="role r3">Security &amp; Testing Enthusiast</text>
    </g>
    <text x="450" y="205" text-anchor="middle" class="role cursor" style="opacity:1" fill="#00f0ff" dx="0"> </text>
    <g stroke="url(#neon)" stroke-width="2" fill="none" opacity="0.9">
      <path d="M18 60V18H60"/><path d="M840 18H882V60"/><path d="M18 220V262H60"/><path d="M840 262H882V220"/>
    </g>
    <rect x="1" y="1" width="898" height="278" rx="18" fill="none" stroke="url(#neon)" stroke-opacity="0.55" stroke-width="2"/>
  </g>
</svg>
